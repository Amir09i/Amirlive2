<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMIR LIVE Q&A</title>
<link rel="stylesheet" href="style.css">
</head>

<body class="broadcast">

<div class="broadcast-screen">

    <header class="topbar">

        <div class="brand">
            <span class="brand-mark">A</span>
            <span>AMIR <b>LIVE</b></span>
        </div>

        <div class="live-indicator">
            <span class="live-dot"></span>
            LIVE
        </div>

    </header>

    <main class="content-layout">

        <!-- منطقة السؤال والجواب -->

        <section class="main-content">

            <div class="section-heading">
                <span class="heading-line"></span>
                <span>اسأل وأنا أجيبك</span>
            </div>

            <div class="question-card">

                <div class="card-top">

                    <span class="small-label">السؤال من</span>

                    <span class="person-name placeholder"
                          id="name">
                        بانتظار السؤال
                    </span>

                </div>

                <div class="question-area">

                    <div class="field-title">
                        السؤال
                    </div>

                    <div class="question-text placeholder"
                         id="question">
                        سيتم عرض السؤال هنا
                    </div>

                </div>

                <div class="divider"></div>

                <div class="answer-area">

                    <div class="field-title answer-title">
                        الإجابة
                    </div>

                    <div class="answer-text placeholder"
                         id="answer">
                        بانتظار الإجابة...
                    </div>

                </div>

            </div>

        </section>

        <!-- المساحة الجانبية -->

        <aside class="side-panel">

            <div class="side-heading">

                <span class="side-icon">✦</span>

                <h2>مساحة جانبية</h2>

            </div>

            <div class="side-content placeholder"
                 id="sideNote">
                مساحة للملاحظات والكلام الإضافي
            </div>

            <div class="side-footer">
                AMIR LIVE Q&A
            </div>

        </aside>

    </main>

    <footer class="bottom-bar">
        <span>حياكم الله جميعاً</span>
        <span class="footer-brand">AMIR</span>
    </footer>

</div>

<script type="module">

import { db } from './firebase.js';

import {
    ref,
    onValue
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";

const liveRef = ref(db, 'live');

function updateField(id, value, fallback) {

    const element = document.getElementById(id);

    const content = value || '';

    if (element.textContent === (content || fallback)) return;

    element.classList.remove('animate-in');

    void element.offsetWidth;

    element.textContent = content || fallback;

    element.classList.toggle('placeholder', !content);

    element.classList.add('animate-in');

}

onValue(liveRef, (snapshot) => {

    const data = snapshot.val() || {};

    updateField(
        'name',
        data.name,
        'بانتظار السؤال'
    );

    updateField(
        'question',
        data.question,
        'سيتم عرض السؤال هنا'
    );

    updateField(
        'answer',
        data.answer,
        'بانتظار الإجابة...'
    );

    updateField(
        'sideNote',
        data.sideNote,
        'مساحة للملاحظات والكلام الإضافي'
    );

});

</script>

</body>
</html>
